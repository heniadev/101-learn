<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>101-learn — interaktywny learner (mockup)</title>
<meta name="description" content="Mockup interaktywnego learnera toolkitu 101: kurs po lewej, sesja agenta po prawej.">
<style>
  :root{
    --bg:#0b0d10;
    --panel:#101317;
    --panel-2:#151920;
    --term:#08090b;
    --line:#1e242c;
    --ink:#e7eaef;
    --muted:#93a0b0;
    --dim:#6b7787;
    --mint:#6ee7a8;
    --amber:#f2bd72;
    --cyan:#7cc7ff;
    --violet:#c0b3ff;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo","Consolas",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- top bar ---------- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:16px;
    padding:0 18px;height:52px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .mark{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
  .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(110,231,168,.12)}
  .mark small{color:var(--dim);font-weight:400;margin-left:2px}
  .bar .spacer{flex:1}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--amber);
    background:rgba(242,189,114,.09);border:1px solid rgba(242,189,114,.22);
    padding:5px 11px;border-radius:999px;
  }
  .bar .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  }
  .bar .reset:hover{color:var(--ink);border-color:#2c343f}

  /* ---------- split ---------- */
  .split{flex:1;display:flex;min-height:0}
  .lesson{
    width:46%;min-width:360px;flex:0 0 auto;
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .term-pane{flex:1;min-width:0;background:var(--term);display:flex;flex-direction:column;min-height:0}

  /* ---------- lesson ---------- */
  .lesson-scroll{flex:1;overflow-y:auto;padding:30px 34px 22px}
  .steps{display:flex;gap:7px;margin-bottom:22px}
  .steps i{height:3px;flex:1;border-radius:2px;background:#232a33;transition:background .3s}
  .steps i.on{background:var(--mint)}
  .steps i.done{background:rgba(110,231,168,.4)}
  .manifest{
    margin:0 0 22px;border-radius:10px;overflow:hidden;
    background:linear-gradient(180deg,rgba(110,231,168,.09),rgba(110,231,168,.03));
    border:1px solid rgba(110,231,168,.25);
  }
  .manifest img{border-bottom:1px solid rgba(110,231,168,.2)}
  .shot{position:relative}
  .shot img{display:block;width:100%;height:auto;transition:opacity .3s}
  .shot img.scanning{opacity:0}
  .shot canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
  .shot canvas.on{display:block}
  .shot .load{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(0,0,0,.45);display:none}
  .shot .load.on{display:block}
  .shot .load i{display:block;height:100%;width:0;background:var(--mint);transition:width .2s}
  .manifest p{font-family:var(--serif);font-size:15px;line-height:1.6;color:#cdd5df;margin:0;padding:14px 16px}
  .manifest p em{color:var(--ink);font-style:normal;font-weight:600}
  .kicker{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  h1{font-size:25px;line-height:1.25;margin:0 0 18px;letter-spacing:-.02em;font-weight:600}
  .body p{font-family:var(--serif);font-size:16.5px;line-height:1.68;color:#cdd5df;margin:0 0 14px}
  .body code{
    font-family:var(--mono);font-size:13.5px;color:var(--mint);
    background:rgba(110,231,168,.08);padding:1px 5px;border-radius:4px;
  }

  .run{
    margin:22px 0 0;display:flex;align-items:center;gap:12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  }
  .run .cmd{font-family:var(--mono);font-size:13.5px;color:var(--ink);flex:1;overflow-x:auto;white-space:nowrap}
  .run .cmd b{color:var(--dim);font-weight:400;margin-right:8px}
  .run button{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
    background:var(--mint);color:#07130d;border:0;border-radius:6px;padding:7px 13px;
  }
  .run button:hover{background:#8af0bb}
  .run.done{border-color:rgba(110,231,168,.3);background:rgba(110,231,168,.05)}
  .run .status{font-size:12.5px;color:var(--mint);display:none;white-space:nowrap}
  .run.done .status{display:block}
  .run.done button{display:none}

  .file{
    margin-top:18px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
    opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;
  }
  .file.show{opacity:1;transform:none}
  .file header{
    display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--panel-2);
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--amber);
  }
  .file header span{margin-left:auto;font-family:var(--sans);color:var(--dim);font-size:11.5px}
  .file pre{
    margin:0;padding:13px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
    color:var(--muted);white-space:pre-wrap;background:#0d1014;
  }

  .nav{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 34px;border-top:1px solid var(--line);background:var(--panel);
  }
  .nav .count{flex:1;font-size:12.5px;color:var(--dim)}
  .nav button{font:inherit;font-size:13.5px;border-radius:7px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted)}
  .nav button:hover:not(:disabled){color:var(--ink);border-color:#2c343f}
  .nav button.primary{background:var(--mint);color:#07130d;border-color:var(--mint);font-weight:500}
  .nav button.primary:hover:not(:disabled){background:#8af0bb}
  .nav button:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- terminal ---------- */
  .term-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;
    border-bottom:1px solid var(--line);background:#0c0e11;
  }
  .term-head .tl{display:flex;gap:6px;margin-right:8px}
  .term-head .tl i{width:10px;height:10px;border-radius:50%;background:#2a313b}
  .term-head .title{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .term-head .hint{margin-left:auto;font-size:11.5px;color:var(--dim)}
  .screen{
    flex:1;overflow-y:auto;padding:16px 18px 24px;cursor:text;
    font-family:var(--mono);font-size:13px;line-height:1.6;color:#c9d2dc;
  }
  .screen .l{white-space:pre-wrap;word-break:break-word;min-height:1.6em}
  .agent{color:var(--cyan)}
  .tool{color:#8fa0b3}
  .ret{color:var(--dim)}
  .ok{color:var(--mint)}
  .warn{color:var(--amber)}
  .dim{color:var(--dim)}
  .you{color:var(--violet)}
  .box{color:#7f8b9a}
  .ps1{color:var(--mint)}
  .cwd{color:var(--cyan)}
  .ghost{color:#39414c}
  .cursor{
    display:inline-block;width:8px;height:1.05em;vertical-align:-2px;
    background:var(--mint);animation:blink 1.05s steps(1) infinite;
  }
  .screen.busy .cursor{animation:none;opacity:.35}
  @keyframes blink{50%{opacity:0}}

  .outro .cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .outro .cta a{
    font-size:13.5px;text-decoration:none;border-radius:7px;padding:9px 17px;
    border:1px solid var(--line);color:var(--muted);
  }
  .outro .cta a.primary{background:var(--mint);border-color:var(--mint);color:#07130d;font-weight:500}

  @media (max-width:900px){
    body{overflow:auto}
    .split{flex-direction:column}
    .lesson{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--line)}
    .term-pane{min-height:56vh}
    .bar .badge span{display:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="mark"><i class="dot"></i>101-learn <small>· interaktywny learner</small></div>
  <div class="spacer"></div>
  <div class="badge">⚑ <span>Sesja agenta jest odtwarzana ze skryptu</span></div>
  <button class="reset" onclick="location.reload()">Zacznij od nowa</button>
</header>

<main class="split">
  <section class="lesson">
    <div class="lesson-scroll" id="pane"></div>
    <div class="nav">

  </section>

    <div class="term-head">
      <div class="tl"><i></i><i></i><i></i></div>
      <div class="title" id="termtitle">bash — /workspace</div>
      <div class="hint" id="hint">kliknij i pisz — Enter uruchamia, Tab uzupełnia, ↑ historia</div>
    </div>
    <div class="screen" id="screen" tabindex="0"></div>
  </section>
</main>

const HOME = "/workspace";
let cwd = HOME;

function vis(e){ return e.w < 0 || done[e.w]; }
function norm(a){
  if (!a) return cwd;
  if (a === "~") return HOME;
  if (a.indexOf("~/") === 0) a = HOME + a.slice(1);
  const raw = a.startsWith("/") ? a : cwd + "/" + a;
  const out = [];
  raw.split("/").forEach(seg => {
    if (!seg || seg === ".") return;
    if (seg === "..") out.pop(); else out.push(seg);
  });
  return "/" + out.join("/");
}
function find(path){ return FS.find(e => e.p === path && vis(e)); }
function kids(path){
  const pre = path + "/";
  return FS.filter(e => vis(e) && e.p.indexOf(pre) === 0 && e.p.slice(pre.length).indexOf("/") === -1);
}

/* Zwraca tablicę [tekst, klasa] albo null, gdy komenda jest nieznana. */
function sh(input){
  const parts = input.split(/\s+/);
  const cmd = parts[0];
  const rest = parts.slice(1);
  const flags = rest.filter(x => x.startsWith("-")).join("");
  const arg = rest.find(x => !x.startsWith("-"));

  if (cmd === "pwd") return [[cwd, ""]];
  if (cmd === "clear"){ history = []; return []; }

  if (cmd === "ls"){
    const t = norm(arg), e = find(t);
    if (!e) return [["ls: " + (arg || ".") + ": No such file or directory", "warn"]];
    if (!e.d) return [[arg, ""]];
    let list = kids(t).map(x => ({ n: x.p.slice(t.length + 1), d: x.d }));
    if (flags.indexOf("a") < 0) list = list.filter(x => x.n[0] !== ".");
    list.sort((a, b) => a.n.localeCompare(b.n));
    return list.map(x => [x.n + (x.d ? "/" : ""), x.d ? "cwd" : ""]);
  }

  if (cmd === "cd"){
    const t = norm(arg || "~"), e = find(t);
    if (!e) return [["cd: " + arg + ": No such file or directory", "warn"]];
    if (!e.d) return [["cd: " + arg + ": Not a directory", "warn"]];
    cwd = t;
    return [];
  }

  if (cmd === "cat" || cmd === "less" || cmd === "more" || cmd === "head"){
    if (!arg) return [[cmd + ": brakuje nazwy pliku", "warn"]];
    const t = norm(arg), e = find(t);
    if (!e) return [[cmd + ": " + arg + ": No such file or directory", "warn"]];
    if (e.d) return [[cmd + ": " + arg + ": Is a directory", "warn"]];
    let lines = (e.b || "").split("\n").map(l => [l, ""]);
    if (cmd === "head") lines = lines.slice(0, 10);
    if (cmd === "less" || cmd === "more") lines.push(["(END) — q kończy podgląd", "ret"]);
    return lines;
  }

  return null;
}

/* Obrazek dojeżdża tak, jak dojeżdżał progresywny JPEG na modemie: pierwszy
   przebieg blokowy, potem coraz drobniejsze. To teatr, nie sieć — plik jest
   już w pamięci. Gra raz na wejście i odpuszcza przy prefers-reduced-motion. */
const PASSES = [
  [1/64, 5, 420], [1/32, 4, 340], [1/16, 3, 300],
  [1/8, 2, 280],  [1/4, 1, 260],  [1/2, 0, 240]
];
let scanned = false;

function progressiveScan(){
  const img = document.getElementById("kapstImg");
  const canvas = document.getElementById("kapstCanvas");
  const bar = document.getElementById("kapstBar");
  if (!img || !canvas || scanned) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  scanned = true;

  const start = () => {
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const W = img.naturalWidth || 1408, H = img.naturalHeight || 768;
    canvas.width = Math.round(W / 2);
    canvas.height = Math.round(H / 2);
    img.classList.add("scanning");
    canvas.classList.add("on");
    bar.classList.add("on");

    let i = 0;
    (function draw(){
      const pass = PASSES[i];
      if (!pass){
        img.classList.remove("scanning");
        canvas.classList.remove("on");
        bar.classList.remove("on");
        return;
      }
      const [scale, blur, hold] = pass;
      const w = Math.max(2, Math.round(W * scale)), h = Math.max(2, Math.round(H * scale));
      const small = document.createElement("canvas");
      small.width = w; small.height = h;
      const sctx = small.getContext("2d");
      sctx.imageSmoothingEnabled = true;
      sctx.drawImage(img, 0, 0, w, h);

      ctx.filter = blur ? "blur(" + blur + "px)" : "none";
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

      i++;
      bar.firstElementChild.style.width = Math.round(i / PASSES.length * 100) + "%";
      setTimeout(draw, hold);
    })();
  };

  if (img.complete && img.naturalWidth) start();
  else img.addEventListener("load", start, { once: true });
}

function push(text, cls){ history.push({ t: text, c: cls || "" }); }

function emit(out, said){
  const step = STEPS[idx];

    out.forEach(l => push(esc(l[0]), l[1]));
    return;
  }
  if (said === "/help"){ out.forEach(l => push(esc(l[0]), l[1])); push("", ""); return; }
  push(esc("⏺ Bash(" + said + ")"), "tool");
  if (!out.length){ push("  ⎿  (bez wyjścia)", "ret"); }
  else out.forEach((l, i) => push("  " + (i === 0 ? "⎿  " : "   ") + esc(l[0]), l[1] || "ret"));
  push("", "");
}

function snark(pool, said){

function submit(){

  histPos = cmdHist.length;

  if (said === ""){ paint(); return; }
  if (!done[idx] && said === step.command){ run(); return; }

  const out = said === "/help" && agentUp ? HELP : sh(said);
  if (out){ emit(out, said); paint(); return; }

  snark(done[idx] ? DONE_SNARK : (agentUp ? AGENT_SNARK : SHELL_SNARK), said);
  paint();
}

function run(){
  if (busy || done[idx]) return;
  const step = STEPS[idx];
  busy = true;
  hint.textContent = "agent pracuje…";
  paint();

  let i = 0;
  (function tick(){
    if (i >= step.out.length){
      busy = false;
      done[idx] = true;
      hint.textContent = "krok wykonany — „Dalej” po lewej";
      if (idx === 0){ agentUp = true; ttitle.textContent = "claude — /workspace"; }
      render();
      return;
    }
    const [text, cls, delay] = step.out[i++];
    push(esc(text), cls);
    paint();
    setTimeout(tick, delay);
  })();
}

screen.addEventListener("click", () => screen.focus());
screen.addEventListener("keydown", e => {
  if (busy || outro) return;
  const cmd = STEPS[idx].command;
  if (e.key === "Enter"){ e.preventDefault(); submit(); return; }
  if (e.key === "Backspace"){ e.preventDefault(); buf = buf.slice(0, -1); paint(); return; }
  if (e.key === "Tab"){ e.preventDefault(); if (!done[idx] && cmd.indexOf(buf) === 0) buf = cmd; paint(); return; }
  if (e.key === "Escape"){ e.preventDefault(); buf = ""; histPos = cmdHist.length; paint(); return; }
  if (e.key === "ArrowUp"){
    e.preventDefault();
    if (!cmdHist.length) return;
    if (histPos === cmdHist.length) draft = buf;
    histPos = Math.max(0, histPos - 1);
    buf = cmdHist[histPos];
    paint(); return;
  }
  if (e.key === "ArrowDown"){
    e.preventDefault();
    if (histPos >= cmdHist.length) return;
    histPos++;
    buf = histPos === cmdHist.length ? draft : cmdHist[histPos];
    paint(); return;
  }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    if (buf.length < 120) buf += e.key;
    paint();
  }
});

/* ---------- lewy panel ---------- */
function dots(activeIdx){
  return '<div class="steps">' + STEPS.map((_, i) =>
    '<i class="' + (i === activeIdx ? "on" : done[i] ? "done" : "") + '"></i>').join("") + '</div>';
}

function render(){
  if (outro){ renderOutro(); return; }
  const s = STEPS[idx];
  pane.innerHTML =
    dots(idx)
  + (s.manifest
      ? '<div class="manifest">'
        + '<div class="shot">'
          + '<img id="kapstImg" src="kapst.jpeg" width="1408" height="768" alt="KAPŚT! — Koalicja Agentów Przeciwko Ścianom Tekstu. Aktywny learning skilli agentic AI, bez czytania suchego bla bla bla.">'
          + '<canvas id="kapstCanvas" aria-hidden="true"></canvas>'
          + '<div class="load" id="kapstBar"><i></i></div>'
        + '</div>'
        + '<p>' + s.manifest + '</p></div>'
      : "")
  + '<div class="kicker">' + s.kicker + '</div>'
  + '<h1>' + s.title + '</h1>'
  + '<div class="body">' + s.body.map(p => "<p>" + p + "</p>").join("") + '</div>'
  + '<div class="run' + (done[idx] ? " done" : "") + '">'
    + '<div class="cmd"><b>' + (s.ps === "agent" ? "&gt;" : "$") + '</b>' + esc(s.command) + '</div>'
    + '<span class="status">✓ wykonane</span>'
    + '<button id="runb">Uruchom</button>'
  + '</div>'
  + (s.file
      ? '<div class="file' + (done[idx] ? " show" : "") + '">'
        + '<header>' + s.file.path + '<span>powstał po tym kroku</span></header>'
        + '<pre>' + esc(s.file.peek) + '</pre></div>'
      : "");

  if (s.manifest) progressiveScan();

  const rb = document.getElementById("runb");
  if (rb) rb.onclick = () => { screen.focus(); buf = s.command; submit(); };

  count.textContent = idx === 0 ? "przed startem" : "krok " + idx + " z 3";
  backB.disabled = idx === 0;
  nextB.disabled = !done[idx];
  nextB.style.display = "";
  nextB.textContent = idx === STEPS.length - 1 ? "Zakończ" : "Dalej";
  if (!done[idx]) hint.textContent = "kliknij i pisz — Enter uruchamia, Tab uzupełnia, ↑ historia";
  paint();
}

function renderOutro(){
  pane.innerHTML =
    '<div class="steps">' + STEPS.map(() => '<i class="done"></i>').join("") + '</div>'
  + '<div class="outro">'
  + '<div class="kicker">koniec ścieżki</div>'
  + '<h1>To był cały toolkit w miniaturze</h1>'
  + '<div class="body">'
    + '<p>Jedna sesja agenta, trzy komendy, trzy pliki — i pamięć projektu, która przeżywa rozmowę. Zamknij okno, wróć jutro: skille czytają pliki, nie historię czatu.</p>'
    + '<p>Reszta ścieżki działa tak samo. Najpierw fundamenty — <code>/101-tech-stack-selector</code>, <code>/101-roadmap</code> — a potem pętla jednej zmiany: <code>/101-new</code> → <code>/101-plan</code> → <code>/101-implement</code> → <code>/101-impl-review</code> → <code>/101-archive</code>.</p>'
  + '</div>'
  + '<div class="cta">'
    + '<a class="primary" href="https://github.com/heniadev/101-learn">Repozytorium 101-learn</a>'
    + '<a href="#" onclick="location.reload();return false;">Przejdź jeszcze raz</a>'
  + '</div></div>';
  count.textContent = "3 z 3 · gotowe";
  backB.disabled = false;
  nextB.style.display = "none";
  paint();
}

nextB.onclick = () => {
  if (!done[idx]) return;
  if (idx === STEPS.length - 1){ outro = true; render(); return; }
  idx++; buf = "";
  push("", "");
  render();
  screen.focus();
};
backB.onclick = () => {
  if (outro){ outro = false; render(); return; }
  if (idx > 0){ idx--; buf = ""; render(); }
};

render();
screen.focus();
</script>
</body>
</html>
