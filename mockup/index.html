<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>101-learn — interaktywny learner (mockup)</title>
<meta name="description" content="Mockup interaktywnego learnera toolkitu 101: kurs po lewej, terminal po prawej.">
<style>
  :root{
    --bg:#0b0d10;
    --panel:#101317;
    --panel-2:#151920;
    --term:#08090b;
    --line:#1e242c;
    --ink:#e7eaef;
    --muted:#93a0b0;
    --dim:#6b7787;
    --mint:#6ee7a8;
    --amber:#f2bd72;
    --cyan:#7cc7ff;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo","Consolas",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- top bar ---------- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:16px;
    padding:0 18px;height:52px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .mark{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
  .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(110,231,168,.12)}
  .mark small{color:var(--dim);font-weight:400;margin-left:2px}
  .bar .spacer{flex:1}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--amber);
    background:rgba(242,189,114,.09);border:1px solid rgba(242,189,114,.22);
    padding:5px 11px;border-radius:999px;
  }
  .bar .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  }
  .bar .reset:hover{color:var(--ink);border-color:#2c343f}

  /* ---------- split ---------- */
  .split{flex:1;display:flex;min-height:0}
  .lesson{
    width:46%;min-width:360px;flex:0 0 auto;
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .term-pane{flex:1;min-width:0;background:var(--term);display:flex;flex-direction:column;min-height:0}

  /* ---------- lesson ---------- */
  .lesson-scroll{flex:1;overflow-y:auto;padding:30px 34px 22px}
  .steps{display:flex;gap:7px;margin-bottom:22px}
  .steps i{height:3px;flex:1;border-radius:2px;background:#232a33;transition:background .3s}
  .steps i.on{background:var(--mint)}
  .steps i.done{background:rgba(110,231,168,.4)}
  .kicker{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  h1{font-size:25px;line-height:1.25;margin:0 0 18px;letter-spacing:-.02em;font-weight:600}
  .body p{font-family:var(--serif);font-size:16.5px;line-height:1.68;color:#cdd5df;margin:0 0 14px}
  .body code{
    font-family:var(--mono);font-size:13.5px;color:var(--mint);
    background:rgba(110,231,168,.08);padding:1px 5px;border-radius:4px;
  }

  .run{
    margin:22px 0 0;display:flex;align-items:center;gap:12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  }
  .run .cmd{font-family:var(--mono);font-size:13.5px;color:var(--ink);flex:1;overflow-x:auto;white-space:nowrap}
  .run .cmd b{color:var(--dim);font-weight:400;margin-right:8px}
  .run button{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
    background:var(--mint);color:#07130d;border:0;border-radius:6px;padding:7px 13px;
  }
  .run button:hover{background:#8af0bb}
  .run.done{border-color:rgba(110,231,168,.3);background:rgba(110,231,168,.05)}
  .run .status{font-size:12.5px;color:var(--mint);display:none;white-space:nowrap}
  .run.done .status{display:block}
  .run.done button{display:none}

  .file{
    margin-top:18px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
    opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;
  }
  .file.show{opacity:1;transform:none}
  .file header{
    display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--panel-2);
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--amber);
  }
  .file header span{margin-left:auto;font-family:var(--sans);color:var(--dim);font-size:11.5px}
  .file pre{
    margin:0;padding:13px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
    color:var(--muted);white-space:pre-wrap;background:#0d1014;
  }

  .nav{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 34px;border-top:1px solid var(--line);background:var(--panel);
  }
  .nav .count{flex:1;font-size:12.5px;color:var(--dim)}
  .nav button{font:inherit;font-size:13.5px;border-radius:7px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted)}
  .nav button:hover:not(:disabled){color:var(--ink);border-color:#2c343f}
  .nav button.primary{background:var(--mint);color:#07130d;border-color:var(--mint);font-weight:500}
  .nav button.primary:hover:not(:disabled){background:#8af0bb}
  .nav button:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- terminal ---------- */
  .term-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;
    border-bottom:1px solid var(--line);background:#0c0e11;
  }
  .term-head .tl{display:flex;gap:6px;margin-right:8px}
  .term-head .tl i{width:10px;height:10px;border-radius:50%;background:#2a313b}
  .term-head .title{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .term-head .hint{margin-left:auto;font-size:11.5px;color:var(--dim)}
  .screen{
    flex:1;overflow-y:auto;padding:16px 18px 24px;cursor:text;
    font-family:var(--mono);font-size:13.5px;line-height:1.62;color:#c9d2dc;
  }
  .screen .l{white-space:pre-wrap;word-break:break-word;min-height:1.62em}
  .agent{color:var(--cyan)}
  .ok{color:var(--mint)}
  .warn{color:var(--amber)}
  .dim{color:var(--dim)}
  .you{color:#c0b3ff}
  .ps1{color:var(--mint)}
  .cwd{color:var(--cyan)}
  .ghost{color:#39414c}
  .cursor{
    display:inline-block;width:8px;height:1.05em;vertical-align:-2px;
    background:var(--mint);animation:blink 1.05s steps(1) infinite;
  }
  .screen.busy .cursor{animation:none;opacity:.35}
  @keyframes blink{50%{opacity:0}}

  .outro{padding:30px 34px}
  .outro h1{margin-bottom:14px}
  .outro .cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .outro .cta a,.outro .cta button{
    font:inherit;font-size:13.5px;text-decoration:none;border-radius:7px;padding:9px 17px;cursor:pointer;
    border:1px solid var(--line);color:var(--muted);background:none;
  }
  .outro .cta a.primary{background:var(--mint);border-color:var(--mint);color:#07130d;font-weight:500}

  @media (max-width:900px){
    body{overflow:auto}
    .split{flex-direction:column}
    .lesson{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--line)}
    .term-pane{min-height:56vh}
    .bar .badge span{display:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="mark"><i class="dot"></i>101-learn <small>· interaktywny learner</small></div>
  <div class="spacer"></div>
  <div class="badge">⚑ <span>Agent w terminalu odtwarza pre-programowane odpowiedzi</span></div>
  <button class="reset" onclick="location.reload()">Zacznij od nowa</button>
</header>

<main class="split">
  <section class="lesson">
    <div class="lesson-scroll" id="pane"></div>
    <div class="nav">
      <span class="count" id="count"></span>
      <button id="back">Wstecz</button>
      <button id="next" class="primary">Dalej</button>
    </div>
  </section>

  <section class="term-pane">
    <div class="term-head">
      <div class="tl"><i></i><i></i><i></i></div>
      <div class="title">bash — /workspace</div>
      <div class="hint" id="hint">kliknij i uderz w dowolne klawisze</div>
    </div>
    <div class="screen" id="screen" tabindex="0"></div>
  </section>
</main>

<script>
const STEPS = [
  {
    kicker: "Krok 1 z 3 · fundament",
    title: "Zrób miejsce na pamięć projektu",
    body: [
      "Toolkit 101 nie trzyma pamięci w rozmowie — trzyma ją w plikach. Możesz zamknąć laptopa w dowolnym momencie i wrócić jutro dokładnie tam, gdzie skończyłeś.",
      "<code>/101-init</code> zakłada drzewo <code>context/</code>: <code>foundation/</code> na dokumenty żyjące tyle co projekt, <code>changes/</code> na pracę w toku, <code>archive/</code> na zamknięte zmiany. Nic więcej się nie dzieje — to wygoda, nie wymóg.",
      "Wpisz komendę w terminalu po prawej. Uderz w dowolne klawisze — komenda dopisze się sama."
    ],
    command: "/101-init",
    out: [
      ["● Sprawdzam stan repozytorium…", "agent", 420],
      ["", "", 60],
      ["● Tworzę szkielet kontekstu", "agent", 260],
      ["", "", 40],
      ["  context/", "", 70],
      ["  ├── foundation/   długo żyjące dokumenty", "dim", 70],
      ["  ├── changes/      praca w toku", "dim", 70],
      ["  └── archive/      zamknięte zmiany", "dim", 120],
      ["", "", 40],
      ["  3 katalogi · 3 pliki README z konwencjami", "dim", 220],
      ["", "", 60],
      ["✓ Kontekst gotowy.", "ok", 60],
      ["  Następny krok: /101-shape <twój pomysł>", "dim", 60]
    ],
    file: {
      path: "context/foundation/README.md",
      peek: "# foundation/\n\nDokumenty, które żyją tak długo jak projekt.\nshape-notes.md · prd.md · roadmap.md · tech-stack.md"
    }
  },
  {
    kicker: "Krok 2 z 3 · rozmowa",
    title: "Zamień pomysł w notatki",
    body: [
      "<code>/101-shape</code> to prowadzona rozmowa, nie formularz. Skill zadaje jedno otwarte pytanie naraz i na bieżąco dopisuje <code>context/foundation/shape-notes.md</code>.",
      "Robi przy tym trzy rzeczy, których nie robi zwykły czat: nazywa pusty pomysł po imieniu, przycina zakres, gdy pierwsza wersja robi się za duża, i atakuje każde wymaganie jednym trudnym pytaniem — „co musiałoby być prawdą, żeby to zaszkodziło produktowi?”.",
      "Odpowiedzi poniżej są odtworzone ze skryptu. W prawdziwej sesji piszesz tam swoje."
    ],
    command: "/101-shape interaktywny learner w przeglądarce",
    out: [
      ["● Czytam context/ — brak notatek, zaczynamy od zera.", "agent", 460],
      ["", "", 60],
      ["❯ Kto ma z tego skorzystać i co go dziś blokuje?", "", 260],
      ["› deweloper, który słyszał o toolkicie i nie ma jak go zobaczyć", "you", 90],
      ["  przed instalacją — droga do pierwszego efektu to ponad 30 minut", "you", 260],
      ["", "", 60],
      ["❯ Jaką decyzję ta aplikacja podejmuje za niego?", "", 300],
      ["› żadnej. Pokazuje przebieg — ale musi być wierny,", "you", 90],
      ["  inaczej uczący się poczuje się oszukany", "you", 300],
      ["", "", 60],
      ["⚑ Zapisuję to jako wymaganie, nie jako styl: wierność przebiegu.", "warn", 380],
      ["", "", 60],
      ["✓ Dopisano shape-notes.md — Problem, Persona, Zakres, Non-goals", "ok", 60],
      ["  Następny krok: /101-prd", "dim", 60]
    ],
    file: {
      path: "context/foundation/shape-notes.md",
      peek: "## Problem\nDroga do pierwszego efektu — instalacja, własny projekt,\npierwsze kroki — to ponad 30 minut. Większość odpada po drodze.\n\n## Non-goals\n— konta i zapisywanie postępu"
    }
  },
  {
    kicker: "Krok 3 z 3 · dokument",
    title: "Wygeneruj dokument wymagań",
    body: [
      "<code>/101-prd</code> zamienia notatki w <code>context/foundation/prd.md</code> o stałym kształcie: wizja, persona, kryteria sukcesu, historyjki, wymagania, reguła biznesowa, kontrola dostępu, non-goals.",
      "Dwie rzeczy są tu ważne. Skill nie zmyśla — czego nie powiedziałeś, zostaje widocznym znacznikiem <code>[GAP: …]</code> i trafia na listę otwartych pytań. I trzyma technologię poza dokumentem: wymagania mówią CO, wybór stacku mówi CZYM.",
      "Po tym kroku na dysku leży realny dokument, który sam wywołałeś."
    ],
    command: "/101-prd",
    out: [
      ["● Czytam context/foundation/shape-notes.md", "agent", 380],
      ["● Składam dokument wymagań…", "agent", 520],
      ["", "", 60],
      ["  Wizja i problem             ✓", "dim", 110],
      ["  Persona                     ✓", "dim", 110],
      ["  Kryteria sukcesu            ✓", "dim", 110],
      ["  Historyjki (US-01)          ✓", "dim", 110],
      ["  Wymagania (FR-010…FR-080)   ✓", "dim", 110],
      ["  Non-goals                   ✓", "dim", 200],
      ["", "", 60],
      ["⚑ 3 luki — nie zgaduję, zapisuję:", "warn", 260],
      ["    [GAP: treść kursu]                     blokująca", "warn", 90],
      ["    [GAP: wielu równoczesnych uczących się]", "warn", 90],
      ["    [GAP: nazwa produktu]", "warn", 240],
      ["", "", 60],
      ["✓ Zapisano context/foundation/prd.md (184 linie)", "ok", 60],
      ["  Następny krok: /101-tech-stack-selector", "dim", 60]
    ],
    file: {
      path: "context/foundation/prd.md",
      peek: "## Success Criteria\n\nUczący się przechodzi trzy kroki ścieżki (/101-init,\n/101-shape, /101-prd) w przeglądarce, bez instalacji,\ni na końcu widzi realny dokument, który sam wywołał."
    }
  }
];

const pane   = document.getElementById("pane");
const screen = document.getElementById("screen");
const hint   = document.getElementById("hint");
const nextB  = document.getElementById("next");
const backB  = document.getElementById("back");
const count  = document.getElementById("count");

let idx = 0;
let typed = 0;          // ile znaków komendy jest już "wpisane"
let busy = false;       // trwa odtwarzanie odpowiedzi
let done = [false, false, false];
let outro = false;

/* ---------- terminal ---------- */
let history = [];       // zamknięte linie scrollbacku

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function promptHTML(){
  const cmd = STEPS[idx].command;
  const hit = esc(cmd.slice(0, typed));
  const rest = esc(cmd.slice(typed));
  return '<span class="ps1">learner@101</span><span class="dim">:</span><span class="cwd">/workspace</span><span class="dim">$</span> '
       + hit + '<span class="cursor"></span><span class="ghost">' + rest + '</span>';
}

function paint(){
  const lines = history.map(h => '<div class="l ' + h.c + '">' + h.t + '</div>').join("");
  screen.innerHTML = lines + (busy || done[idx] ? "" : '<div class="l">' + promptHTML() + '</div>');
  screen.classList.toggle("busy", busy);
  screen.scrollTop = screen.scrollHeight;
}

function push(text, cls){ history.push({ t: text, c: cls || "" }); }

function run(){
  if (busy || done[idx]) return;
  const step = STEPS[idx];
  typed = step.command.length;
  push(promptHTML().replace(/<span class="cursor"><\/span>/, "").replace(/<span class="ghost"><\/span>/, ""), "");
  busy = true;
  hint.textContent = "agent odpowiada…";
  paint();

  let i = 0;
  (function step_(){
    if (i >= step.out.length){
      busy = false;
      done[idx] = true;
      hint.textContent = "krok wykonany";
      render();
      return;
    }
    const [text, cls, delay] = step.out[i++];
    push(esc(text), cls);
    paint();
    setTimeout(step_, delay);
  })();
}

screen.addEventListener("click", () => screen.focus());
screen.addEventListener("keydown", e => {
  if (busy || done[idx] || outro) return;
  const cmd = STEPS[idx].command;
  if (e.key === "Enter"){
    e.preventDefault();
    if (typed >= cmd.length) run();
    else { typed = cmd.length; paint(); }
    return;
  }
  if (e.key === "Backspace"){ e.preventDefault(); typed = Math.max(0, typed - 1); paint(); return; }
  if (e.key === "Tab"){ e.preventDefault(); typed = cmd.length; paint(); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    typed = Math.min(cmd.length, typed + 1);
    paint();
  }
});

/* ---------- lesson panel ---------- */
function render(){
  if (outro){ renderOutro(); return; }
  const s = STEPS[idx];
  pane.innerHTML =
    '<div class="steps">' + STEPS.map((_, i) =>
      '<i class="' + (i === idx ? "on" : done[i] ? "done" : "") + '"></i>').join("") + '</div>'
  + '<div class="kicker">' + s.kicker + '</div>'
  + '<h1>' + s.title + '</h1>'
  + '<div class="body">' + s.body.map(p => "<p>" + p + "</p>").join("") + '</div>'
  + '<div class="run' + (done[idx] ? " done" : "") + '">'
    + '<div class="cmd"><b>$</b>' + esc(s.command) + '</div>'
    + '<span class="status">✓ wykonane</span>'
    + '<button id="runb">Uruchom</button>'
  + '</div>'
  + '<div class="file' + (done[idx] ? " show" : "") + '">'
    + '<header>' + s.file.path + '<span>powstał po tym kroku</span></header>'
    + '<pre>' + esc(s.file.peek) + '</pre>'
  + '</div>';

  const rb = document.getElementById("runb");
  if (rb) rb.onclick = () => { screen.focus(); run(); };

  count.textContent = "krok " + (idx + 1) + " z " + STEPS.length;
  backB.disabled = idx === 0;
  nextB.disabled = !done[idx];
  nextB.textContent = idx === STEPS.length - 1 ? "Zakończ" : "Dalej";
  backB.style.display = "";
  nextB.style.display = "";
  if (!done[idx]) hint.textContent = "kliknij i uderz w dowolne klawisze";
  paint();
}

function renderOutro(){
  pane.innerHTML =
    '<div class="steps">' + STEPS.map(() => '<i class="done"></i>').join("") + '</div>'
  + '<div class="outro" style="padding:0">'
  + '<div class="kicker">koniec ścieżki</div>'
  + '<h1>To był cały toolkit w miniaturze</h1>'
  + '<div class="body">'
    + '<p>Trzy komendy, trzy pliki — i pamięć projektu, która przeżywa rozmowę. Reszta ścieżki działa dokładnie tak samo: każdy skill czyta pliki, zapisuje jeden plik i mówi, co dalej.</p>'
    + '<p>Dalej czeka <code>/101-tech-stack-selector</code>, <code>/101-roadmap</code> i pętla jednej zmiany: <code>/101-new</code> → <code>/101-plan</code> → <code>/101-implement</code> → <code>/101-impl-review</code> → <code>/101-archive</code>.</p>'
  + '</div>'
  + '<div class="cta">'
    + '<a class="primary" href="https://github.com/heniadev/101-skills">Zainstaluj toolkit</a>'
    + '<a href="#" onclick="location.reload();return false;">Przejdź jeszcze raz</a>'
  + '</div></div>';
  count.textContent = "3 z 3 · gotowe";
  backB.disabled = false;
  nextB.style.display = "none";
}

nextB.onclick = () => {
  if (!done[idx]) return;
  if (idx === STEPS.length - 1){ outro = true; render(); return; }
  idx++; typed = 0;
  history.push({ t: "", c: "" });
  render();
  screen.focus();
};
backB.onclick = () => {
  if (outro){ outro = false; render(); return; }
  if (idx > 0){ idx--; typed = done[idx] ? STEPS[idx].command.length : 0; render(); }
};

render();
screen.focus();
</script>
</body>
</html>
